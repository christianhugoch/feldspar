[workspace]
resolver = "3"
members = [
    # Layer 0 — foundations
    "crates/sc-error",
    "crates/sc-log",
    # Layer 1 — query language, expression language
    "crates/sc-query",
    "crates/sc-expr",
    # Layer 2 — database
    "crates/sc-db",
    "crates/sc-db-postgres",
    # Layer 3 — types
    "crates/sc-types",
    # Layer 4 — catalog
    "crates/sc-catalog",
    # Layer 5 — users/auth, files, configuration values
    "crates/sc-auth",
    "crates/sc-files",
    "crates/sc-config",
    # Layer 6 — actions & triggers, the LLM provider seam and the mail transport
    "crates/sc-action",
    "crates/sc-llm",
    "crates/sc-email",
    # Layer 7 — agents: the agent record, the trait extension point, the loop
    "crates/sc-agent",
    # Layer 8 — applications & API
    "crates/sc-api",
    "crates/sc-app",
    # Layer 9 — the core built-in actions (above the row layer, because three of
    # them write rows through it), the core built-in agent traits (above it for
    # exactly the same reason) and the server
    "crates/sc-core-actions",
    "crates/sc-core-traits",
    "crates/sc-server",
    # Layer 10 — CLI binary
    "crates/sc-cli",
    # Cross-crate integration-test harness (shared helper; not published)
    "tests/harness",
]

# Shared package metadata inherited by every member crate via `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Saltcorn contributors"]
repository = "https://github.com/saltcorn/saltcorn"
rust-version = "1.85"

# Internal crates are referenced by path so the strict layering in the technical
# design (§2) is expressed directly in the dependency graph.
[workspace.dependencies]
sc-error = { path = "crates/sc-error" }
sc-log = { path = "crates/sc-log" }
sc-query = { path = "crates/sc-query" }
# `default-features = false` at the workspace level so members choose: the
# catalog takes the parse/validate/translate half only; the server adds
# `features = ["eval"]` for the V8-backed reified evaluator.
sc-expr = { path = "crates/sc-expr", default-features = false }
sc-db = { path = "crates/sc-db" }
sc-db-postgres = { path = "crates/sc-db-postgres" }
sc-types = { path = "crates/sc-types" }
sc-catalog = { path = "crates/sc-catalog" }
sc-auth = { path = "crates/sc-auth" }
sc-files = { path = "crates/sc-files" }
sc-config = { path = "crates/sc-config" }
sc-action = { path = "crates/sc-action" }
sc-llm = { path = "crates/sc-llm" }
sc-email = { path = "crates/sc-email" }
sc-agent = { path = "crates/sc-agent" }
sc-api = { path = "crates/sc-api" }
sc-app = { path = "crates/sc-app" }
sc-core-actions = { path = "crates/sc-core-actions" }
sc-core-traits = { path = "crates/sc-core-traits" }
sc-server = { path = "crates/sc-server" }
sc-test-harness = { path = "tests/harness" }

# --- Core third-party dependencies, pinned once for the whole workspace ------
#
# Runtime decision (TODO Phase 0): the workspace is built on the **tokio** async
# runtime. Every async trait in the technical design (`DatabaseDriver`,
# `TableProvider`, `FileStore`, `ApiProvider`, …) is expressed with `async_trait`
# over tokio.
#
# Postgres driver decision: **tokio-postgres + deadpool-postgres**, not sqlx.
# `sc-query` already renders a `Statement` into `(sql, binds)`, so sqlx's
# compile-time-checked query macros would add no value; tokio-postgres gives
# native `$n` parameter binding and row streaming that map directly onto the
# design's `RowStream`, and deadpool-postgres supplies pooling. This keeps the
# dependency graph minimal (design principle: minimal, acyclic deps).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "time",
    "sync",
    "io-util",
    # `process` drives a code framework's build step (design §13.3): the bundler
    # is an external process, awaited without blocking a runtime thread.
    "process",
] }
async-trait = "0.1"
# Async stream abstractions for `RowStream` (the type `DatabaseDriver::query`
# returns). Only the lightweight `Stream` trait + combinators are used.
futures = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `saltcorn.toml` configuration file (`sc-cli`): per-environment database
# connection parameters, read when the environment does not supply them. TOML
# rather than YAML or JSON because it is the format a Rust operator already has
# a parser for in every other tool on the box, it has comments (a JSON config
# file cannot carry the sentence explaining why staging points where it does),
# and its failure mode is a parse error with a line number rather than YAML's
# silent type coercion. `default-features = false` drops the serializer
# (`display`): nothing writes this file — an operator does — so the crate is
# built as a reader only.
toml = { version = "1.1", default-features = false, features = [
    "std",
    "parse",
    "serde",
] }
uuid = { version = "1", features = ["v4", "serde"] }
# argon2id password hashing. Pinned to the stable 0.5 line (0.6 is only an RC).
# `std` pulls in `getrandom` (via rand_core) so a random salt can be drawn from
# the OS CSPRNG (`OsRng`) when hashing.
argon2 = { version = "0.5", features = ["std"] }
# SHA-256 for session tokens at rest (§7.2). A *fast* hash on purpose: a session
# token is 256 bits of uniform randomness, so there is no dictionary for a slow
# hash to defeat — argon2 above is for passwords, which are guessable.
sha2 = "0.10"
# Bounded LRU for the session cache (§7.2): capacity bounds memory, and the
# store's own freshness TTL bounds staleness.
lru = "0.12"
# Postgres driver + pool. `with-*` features light up ToSql/FromSql for the
# `Value` variants the driver maps in later phases.
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
deadpool-postgres = "0.14"
# tokio-postgres re-exports `bytes` in its `ToSql`/`FromSql` signatures; pinned
# here so the Postgres driver names the same version.
bytes = "1"
# Temporal + decimal backing for the `Value` enum (Date/Time/Timestamp/Decimal).
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
# JavaScript expression parser for ownership formulas (`sc-expr`, TODO Phase 1).
# swc rather than a hand-rolled parser because the reified evaluator is real V8
# (`deno_core`): the parser must accept exactly what V8 accepts, and swc is the
# parser family Deno itself builds on. Parse-only — no transforms, no codegen —
# and the swc AST never leaves `sc-expr`: it is lowered to the crate's own
# `Ast` at the parse boundary.
swc_common = "24"
swc_ecma_ast = "26"
swc_ecma_parser = "42"
# The reified formula evaluator (TODO Phase 3): a real V8 isolate via deno_core,
# so a formula runs under exactly the engine whose grammar swc parses. Built
# with no extensions and no ops — the sandbox has no I/O to reach. Pulls the
# prebuilt static rusty_v8 lib on the big platforms; FreeBSD builds V8 from
# source (upstream carries the ports patches but publishes no binary).
deno_core = "0.408"
# Regex engine for the `String` rich type's `regex` attribute (§2.2). `regex-lite`
# rather than `regex`: a field-validation pattern needs correct matching, not the
# full crate's SIMD/perf dependency tree (aho-corasick, memchr, regex-automata),
# which would pull weight into layer 3 for no gain. Same `Regex::new`/`is_match`
# API for the subset validation uses.
regex-lite = "0.1"
# Extension → MIME mapping for a `File` field's MIME allow-list (§3.5). Already in
# the tree (tower-http's `fs` feature), pinned here as a first-class dependency.
mime_guess = "2"
# RFC 4180 CSV reader/writer for a table's bulk import/export (§13.1). A
# hand-rolled splitter is a line of code until the first quoted field with an
# embedded comma, newline or doubled quote in it — which is precisely what a
# spreadsheet exports — so the format is delegated to the crate that already
# gets those right. `csv` + `csv-core` are the only additions: its remaining
# dependencies (serde, memchr, itoa, ryu) are already in the tree.
csv = "1"
# The backup format: one zip holding an installation's metadata, its rows and its
# files (§16). `zip` is the crate for it — a hand-rolled writer is a weekend until
# the first central-directory edge case, and a backup nobody can open with `unzip`
# is not a backup. `default-features = false` drops every compression method but
# the one a backup wants: `deflate-flate2-zlib-rs` is DEFLATE (what every
# unarchiver on every desktop reads) through a **pure-Rust** zlib, so §16's
# no-C-dependencies posture holds here as it does for TLS. No `aes-crypto`, no
# bzip2/lzma/zstd: a format only this system writes gains nothing from methods a
# reader might not have.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

# --- HTTP server framework ---------------------------------------------------
#
# Web framework decision (design §16): **axum**, on hyper + tower. It is
# maintained by the tokio team and runs directly on the already-chosen
# tokio/hyper stack with no separate runtime (unlike actix-web's actix-rt);
# handlers are plain async fns rather than macro-driven routing (unlike Rocket);
# and it is unopinionated enough to build the reified `Endpoint` registry
# (design §13.1) on top of. tower / tower-http supply the middleware the design
# needs — strict CSP + security headers (`set-header`) and `ServeDir` (`fs`) to
# serve the built `ui/admin` SPA bundle. `matchit` is axum's own path-router
# crate, used directly to dispatch application routes that are registered at
# runtime and are therefore not known at compile time (design §13.1). `axum-extra`
# supplies the cookie jar for session cookies; the session store itself stays in
# `sc-auth`. Versions track the current axum 0.8 stable line; exact pairings are
# confirmed when Phase 6 first compiles against them.
# `ws` carries the file-store IDE's language server (§12.1): one WebSocket per
# workbench, bridged to a `typescript-language-server` process on the server.
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }

# --- TLS termination (design §13.5) ------------------------------------------
#
# The server terminates TLS itself so a deployment needs no reverse proxy, and
# it does it with **rustls** — the same stack `reqwest` already brings, and no
# OpenSSL anywhere in the tree (§16).
#
# `axum-server` is the piece axum does not have: `axum::serve` takes a
# `TcpListener` and knows nothing about a TLS handshake, whereas `axum-server`
# accepts through an `Accept` implementation — which is exactly the seam both
# certificate sources plug into (a fixed rustls config for a pasted
# certificate, `rustls-acme`'s acceptor for an ACME one). `tls-rustls` rather
# than `tls-rustls-no-provider` so rustls's `aws-lc-rs` provider is compiled in
# and can be installed by name at boot: two crypto providers reach the tree
# (this and `ring`, via other dependencies), and rustls refuses to guess between
# them.
axum-server = { version = "0.8", features = ["tls-rustls"] }
# Building a `ServerConfig` from a pasted certificate, and installing the
# process-wide crypto provider. Version-pinned with `axum-server` and
# `rustls-acme`, which both hand us `rustls` types — two rustls versions in one
# binary would be two unrelated `ServerConfig`s that do not typecheck against
# each other.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "std",
    "tls12",
] }
# Parsing the admin's pasted PEM. Deliberately a parser rather than a
# hand-rolled base64 splitter: "which of PKCS#8, PKCS#1 and SEC1 is this key?"
# is not a question to answer with `starts_with`.
rustls-pemfile = "2"
# The ACME client (§13.5): pure Rust, no `certbot` process, and it answers the
# **TLS-ALPN-01** challenge inside the TLS handshake it is already terminating —
# so there is no HTTP-01 route to open on port 80 and nothing to keep in step
# with the router. `tokio` is the runtime feature; `axum` supplies the
# `axum-server` acceptor so both certificate sources reach the listener the same
# way.
rustls-acme = { version = "0.15", features = ["tokio", "axum"] }
# Certificate generation **for tests only** (a dev-dependency wherever it is
# used): a TLS test needs a certificate, and the two alternatives — checking one
# into the repository or asking a CA for one — are a key in git and a network
# dependency respectively. Already in the tree as `rustls-acme`'s own
# dependency, pinned here so there is one version of it.
rcgen = "0.13"
# Base64 for carrying file bytes across the JSON file-manager API (§14.1). The
# file endpoints reuse the same typed-JSON dispatch as the rest of the admin API
# rather than special-casing binary routes, so file contents ride in JSON as
# base64 (with a UTF-8 `text` shortcut for editing text files).
base64 = "0.22"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
matchit = "0.8"
# A WebSocket **client**, for tests only: the IDE's language-server route (§12.1)
# is the one piece of the server a `tower::oneshot` cannot exercise, because the
# thing under test happens *after* the 101. Same version axum's `ws` feature
# already builds, so this adds no new code to the tree.
tokio-tungstenite = "0.29"

# --- GraphQL -----------------------------------------------------------------
#
# GraphQL library decision (TODO "GraphQL API" decision 1): **async-graphql**
# with the `dynamic-schema` feature. Our schema is *data* — an admin or an agent
# creates a table at runtime and the API must have it at the next mount — which
# rules out every macro-driven library (`juniper`) outright, since a
# compile-time schema means generating Rust and restarting the server.
# `async_graphql::dynamic` builds a schema from runtime values and brings
# parsing, validation, variable coercion, introspection, `sdl()`, error
# formatting and the depth/complexity limits with it; `apollo-compiler`, the
# runner-up, parses and validates but does not execute, and would have us write
# variable coercion and the error format for no capability we lack. The full
# survey is §1 of docs/GRAPHQL_API.md.
#
# **The stable 7.2 line, not the 8.0 release candidates.** 8.0 is at `-rc` and
# an API surface this central is not somewhere to track a release candidate.
#
# `default-features = false` drops the web-framework integrations, the
# playground HTML and the tracing/opentelemetry extensions: this crate is
# transport-agnostic (`ApiRequest`/`ApiResponse`, never axum types), the
# explorer is an admin screen rather than a CDN-loaded GraphiQL, and the
# application CSP is `default-src 'self'`. `dataloader` is the batching the
# level-batched executor keys child lists through (decision 3).
async-graphql = { version = "7.2", default-features = false, features = [
    "dynamic-schema",
    "dataloader",
] }

# --- HTTP client -------------------------------------------------------------
#
# Client decision (TODO Phase 3, the `fetch` action): **reqwest**, with
# `default-features = false` and `rustls-tls` — no OpenSSL anywhere in the tree,
# matching §16's pure-Rust TLS posture (a deployment must not need a system
# libssl to call a webhook). It rides the hyper/tokio stack the server already
# has, so this adds a TLS stack and the client itself, not a second runtime.
# `json` is the request-body serialiser only; responses are read as bytes and
# parsed with `serde_json` here, so the crate's charset machinery is not needed.
#
# **0.13, because `rig-core` builds on it** (TODO Phase 1). The `fetch` action
# was written against 0.12; letting `sc-llm` pull its own would put two reqwests,
# two hyper stacks and two rustls configurations in one binary — the thing
# pinning versions here exists to prevent. The 0.13 rename of `rustls-tls` to
# `rustls` is the whole of the migration, since nothing in the tree touches the
# parts that changed shape.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }

# --- Mail transport (design §18.2) -------------------------------------------
#
# The SMTP client behind `sc-email`'s own `Mailer` seam. `lettre` is the crate
# for it: it is the maintained Rust SMTP client, it builds the MIME message as
# well as sending it (so `multipart/alternative` is a method call rather than a
# hand-written boundary), and it has an async transport over tokio.
#
# `default-features = false` drops `native-tls`, `hostname` and the sendmail
# transport. The rest of the set is chosen to add **no new crates to the tree**:
# `aws-lc-rs` is the crypto provider the `rustls` pin above already compiles in
# — two providers in one binary is exactly what that pin exists to prevent — and
# `rustls-platform-verifier` is the root store `reqwest` 0.13 already brings, so
# a mail server's certificate is verified against the same roots a webhook's is.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "pool",
    "tokio1",
    "tokio1-rustls",
    "rustls",
    "aws-lc-rs",
    "rustls-platform-verifier",
] }

# The MJML compiler behind `sc-email::render_mjml`. MJML is the markup an email
# designer already writes — `mj-section`/`mj-column`/`mj-button` instead of the
# nested tables and conditional comments a message has to be for Outlook to lay
# it out — and `mrml` is the Rust reimplementation of it, so a body written that
# way compiles **in process** rather than through a Node sidecar (v1 ran MJML's
# own JavaScript implementation, which is why it needs one).
#
# `default-features = false` keeps `parse` and `render` and drops `json` (the AST
# as serde, which nothing here serialises) and `print` (writing MJML back out).
# The default include loader refuses `mj-include`, which is the behaviour we
# want: a template is data an admin typed, and it must not be able to make the
# server read a file or call a URL.
mrml = { version = "6.0", default-features = false, features = [
    "parse",
    "render",
] }

# --- LLM providers -----------------------------------------------------------
#
# The provider calls behind `sc-llm`'s own object-safe seam (design §11.1, TODO
# Phase 1 decision 1). `rig-core` is the only surveyed crate carrying OpenAI's
# **Responses** API as a first-class provider *and* a maintained Anthropic
# provider; the survey and the rejected alternatives are in §11.1.
#
# `default-features = false` because rig's defaults pull the derive macro, rayon
# and the document loaders (pdf, epub, image), none of which a provider call
# needs. `reqwest` + `rustls` are the two features that matter: they make rig
# build on the same HTTP client the `fetch` action already uses — which is why
# the reqwest pin above is 0.13 — and keep TLS pure-Rust per §16.
#
# **Only the call is rig's**: not its `Agent`, not its tool registry, not its
# RAG. Nothing rig exposes appears in an `sc-llm` public signature, for the
# reason §2 gives generally — a provider abstraction is exactly the kind of
# dependency whose API churns.
rig-core = { version = "0.41", default-features = false, features = [
    "reqwest",
    "rustls",
] }

# Workspace-wide lints. Principle 5 (no silent failures): library code must not
# `unwrap()`/`expect()` on fallible paths — return a `sc-error::Result` instead.
# Member crates opt in with `[lints]` + `workspace = true`. Test code is exempted
# via `clippy.toml` (`allow-unwrap-in-tests` / `allow-expect-in-tests`). These
# lints fire under `cargo clippy`, not `cargo build`/`cargo test`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# --- Build profiles ----------------------------------------------------------
#
# Debug-info budget. The workspace has ~110 integration-test targets, and every
# one of them statically links the same tree — V8 (`deno_core`), swc, hyper,
# rustls. With rustc's default `debug = true` each test binary landed at ~440 MB,
# almost all of it DWARF for dependency code, and each link peaked near 1.9 GB
# of linker RSS. `cargo test -j8` therefore ran ~8 of those concurrently and
# pushed the machine into memory pressure hard enough for `systemd-oomd` to kill
# the whole terminal cgroup mid-run.
#
# The split below keeps the debug info that is actually read and drops the rest:
# workspace crates keep line tables, so a panicking test still prints a
# backtrace with file:line — the only thing a test run needs — while
# dependencies get none, because nobody single-steps into V8's bindings. Full
# DWARF for a dependency is available on demand with a one-off
# `--config 'profile.dev.package."*".debug=true'`.
[profile.dev]
debug = "line-tables-only"

# Dependencies carry no debug info: this is the bulk of both the binary size and
# the linker's peak memory.
#
# This covers the test binaries too, and does not need restating under
# `[profile.test]`: `test` inherits from `dev`, and that inheritance carries
# `package."*"` overrides along with everything else. Verified rather than
# assumed — a `cargo test` build of a crate carrying only this key emits a
# dependency rlib with zero `.debug_info` sections, against 18 with the key
# removed.
[profile.dev.package."*"]
debug = false
