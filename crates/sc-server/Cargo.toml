[package]
name = "sc-server"
description = "HTTP server: admin routes, auth, CSP (layer 9)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sc-error.workspace = true
sc-catalog.workspace = true
# Ownership formulas (§7.3): validation, the RLS translatability check on
# save, and — via `eval` — the V8 engine behind the runtime enforcement's
# reified path. The server is the one place the engine is constructed
# (`default_js_evaluator`); everything below holds the trait.
sc-expr = { workspace = true, features = ["eval"] }
sc-auth.workspace = true
sc-files.workspace = true
sc-app.workspace = true
sc-api.workspace = true
# The trigger system, brought up at boot (`install_triggers`): the dispatcher
# lives in `sc-action` and the built-in actions in `sc-core-actions`; this crate
# is where they meet the catalog, because it is the one that serves requests.
sc-action.workspace = true
sc-core-actions.workspace = true
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-query.workspace = true
sc-types.workspace = true

tokio.workspace = true
axum.workspace = true
# `SinkExt`/`StreamExt` over the split WebSocket the IDE's language server rides
# on (§12.1).
futures.workspace = true
axum-extra.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
matchit.workspace = true
base64.workspace = true
bytes.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true

[dev-dependencies]
sc-test-harness.workspace = true
tokio-tungstenite.workspace = true
# A test-only `FileStore` double: the store with no local path, which is what the
# IDE's language-server route has to refuse (§12.1).
async-trait.workspace = true

[lints]
workspace = true
