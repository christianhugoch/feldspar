# The public datasets the Analytics UI's "Get datasets" offers (see `mod.rs`).
#
# Only the *metadata* lives here: what each table is called, its fields and
# their types, where the file is and how to read it, and the licence and credit
# that go with it. The data itself is downloaded when someone asks for it, so
# nothing below redistributes anyone's data and the descriptions are our own
# words. GitHub sources are pinned to a commit so a column cannot be renamed
# under us; the live feeds (NOAA, USGS, OurAirports, Eurostat) cannot be pinned
# and are read by column name, so a new column upstream is ignored.
#
# Shape of an entry:
#
#   [[dataset]]            key, title, category (tabular | hierarchical |
#                          time_series | spatial), description, homepage,
#                          licence, licence_url, attribution, and dataset_table:
#                          the table the Analytics dataset is created on.
#   [[dataset.table]]      in creation order: a table another one references
#                          comes first. `distinct = true` keeps the first row of
#                          each primary key value, which is how a lookup table
#                          (countries, counties) is cut out of a flat file.
#     sources = [{ url, format (csv | json | geojson), bytes, delimiter
#                  ("," default, ";", "\t" or "whitespace"), header (a list of
#                  names when the file has no header row), comment (a line
#                  prefix to skip), na (cells that mean "no value"; an empty
#                  cell always does), constants (extra columns per source) }]
#     fields = [{ name, type, from, label, required, primary_key, references,
#                 if_missing, na, parse }]
#
# `type` is a basic type name (int, float, text, bool, date, timestamp,
# geometry_point, geometry_multipolygon, geometry_multilinestring) or `key`,
# which takes its type from the `references`d table's key. A table with no
# `primary_key` field gets an `id` the database numbers. `from` defaults to the
# field's name; it may be a list: [lon, lat] makes a point, [year, month] or
# [year, month, day] a date. In a GeoJSON file `$geometry` is the feature's
# geometry, `$id` its id and `$z` the third coordinate of a point. `parse` is
# one of year_quarter ("1998 Q1"), year_month ("1850-01"), decimal_year_month
# (1949.0833), epoch_ms, parent_code (the code without its last character, none
# for a two-letter code). `if_missing = "null"` writes no reference when the
# row it names is not in the referenced table.

# --- Tabular ---------------------------------------------------------------------

[[dataset]]
key = "penguins"
title = "Palmer penguins"
category = "tabular"
description = "Bill, flipper and body measurements of three penguin species on three islands near Palmer Station, Antarctica, 2007–2009. A friendly replacement for iris, with some missing values."
homepage = "https://allisonhorst.github.io/palmerpenguins/"
licence = "CC0 1.0"
licence_url = "https://creativecommons.org/publicdomain/zero/1.0/"
attribution = "Horst AM, Hill AP, Gorman KB (2020). palmerpenguins: Palmer Archipelago (Antarctica) penguin data. Data collected by Dr. Kristen Gorman and the Palmer Station Long Term Ecological Research Program."
dataset_table = "penguins"

[[dataset.table]]
name = "penguins"
rows = 344
sources = [{ url = "https://raw.githubusercontent.com/allisonhorst/palmerpenguins/8957207b78d6ccd1b4654a9dd9c9041b657478ab/inst/extdata/penguins.csv", format = "csv", bytes = 15241, na = ["NA"] }]
fields = [
  { name = "species", type = "text", required = true },
  { name = "island", type = "text", required = true },
  { name = "bill_length_mm", type = "float", label = "Bill length (mm)" },
  { name = "bill_depth_mm", type = "float", label = "Bill depth (mm)" },
  { name = "flipper_length_mm", type = "int", label = "Flipper length (mm)" },
  { name = "body_mass_g", type = "int", label = "Body mass (g)" },
  { name = "sex", type = "text" },
  { name = "year", type = "int", required = true },
]

