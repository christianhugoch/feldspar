[package]
name = "sc-catalog"
description = "Catalog, Table, Field, TableProvider trait, cache (layer 4)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sc-error.workspace = true
sc-query.workspace = true
sc-db.workspace = true
# The concrete Postgres backend, for one reason: a *database connection* an
# admin adds in the UI (`db_connections`) is a row here, and turning that row
# into a driver needs the backend that can dial it. `sc-files::connect_from_def`
# names `LocalFileStore` for exactly the same reason — a definition and the
# thing it becomes belong within one crate of each other.
sc-db-postgres.workspace = true
# The same reason, for the other backend: a connection whose backend is `sqlite`
# is a file in a file store, and opening it needs the SQLite driver.
sc-db-sqlite.workspace = true
sc-types.workspace = true
sc-files.workspace = true
# Ownership formulas (§7.3): the catalog parses and validates a table's stored
# formula at merge time. The workspace dep defaults `sc-expr`'s features off,
# which keeps V8 (the `eval` feature) out of this crate's build — the catalog
# only ever parses, validates and describes; evaluation happens in the server.
sc-expr = { workspace = true }
async-trait.workspace = true
# The `_sc_file_stores` JSON columns (a backend's settings, sparse attributes).
serde_json.workspace = true
# UUID row identities for the `_sc_*` tables this crate stores (§9).
uuid.workspace = true

[dev-dependencies]
sc-test-harness.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
