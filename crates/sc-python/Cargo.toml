[package]
name = "sc-python"
description = "The Python code adapter: a code body run on one embedded CPython, over sc-expr's CodeCall and its five host traits (layer 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The runtime rides behind `python-host`, **off by default**, exactly as
# `sc-module`'s `deno-host` does — and for a sharper reason than that one. PyO3
# embeds CPython by *linking* `libpython`, so a binary built with this feature
# fails at the dynamic linker, before `main`, on a host that has no
# `libpython3.x.so`; and this project's shipped artifact is `+crt-static`, under
# which the Python link does not succeed at all (TODO phase 0.5a). So the
# feature is off, the shipped tarball has no Python, and a Python-capable server
# is a separate dynamically-linked build. The crate must go on building and
# testing without the feature, which is what keeps every other crate's test link
# free of a Python toolchain.
#
# Building *with* it needs a CPython 3.11+ with its development library present
# (`libpython3.x.so`, i.e. Debian's `python3-dev`); `PYO3_PYTHON` picks which
# interpreter is linked when the default `python3` is not the one wanted.
#
# One integration-test binary per crate rather than one per file, as everywhere
# else in this workspace: `tests/it.rs` aggregates them.
autotests = false

[features]
default = []
python-host = ["dep:pyo3"]

[dependencies]
sc-error.workspace = true
# `CodeCall`, the five host traits and the `CodeAdapter` trait this crate
# implements. Default features off: the adapter needs the *seam*, not V8 — a
# server that builds Python support does not thereby link a second engine here.
sc-expr.workspace = true
async-trait.workspace = true
# `FuturesUnordered` in the run loop: the caller serves the run's host calls
# while it waits for the run's answer, and both have to be polled at once — as
# does the deadline that bounds them.
futures.workspace = true
serde_json.workspace = true
# The host calls are served on the caller's async runtime while the run's thread
# blocks on the answer, so the seam between them is tokio's: a channel out, a
# oneshot back, and the admission bound is a semaphore. `process` and `fs` are
# the **environment**'s (§9, phase 5): creating the virtual environment and
# installing into it are `python3 -m venv` and `pip`, awaited without blocking a
# runtime thread, and neither is behind the `python-host` feature — a build with
# no interpreter linked in still answers the Modules tab.
tokio = { workspace = true, features = ["process", "fs"] }
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
# `net`/`io-util` are for the `fetch` tests' one-shot HTTP listener: the surface
# is pinned against a real socket rather than a mocked client, so the request it
# builds and the response it reads are the real bytes.
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
# Phase 2.6 asks the `db` surface the same questions `run_js_code.rs` asks, and
# asks them of a **real** database: the lowering is already pinned against a
# recorder (`python_db.rs`), and what a recorder cannot answer is whether the
# plan a chain lowers to is one this server's host actually executes. So the
# tests hold the production pieces — the catalog, the Postgres driver, the
# `TableHost` an action builds, the dispatcher a write's event reaches — and the
# harness that gives each of them a database of its own.
sc-test-harness.workspace = true
sc-catalog.workspace = true
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-api.workspace = true
sc-action.workspace = true
sc-types.workspace = true
# Phase 3.5 asks its questions of the **action** rather than of the runtime:
# `run_python_code` from the registry, over the five hosts an `ActionContext`
# builds. That is the path a firing trigger takes, and it is the only way to
# reach `CodeFetchHost` — which is this crate's `fetch` tests' whole point, since
# a second implementation of it here would assert nothing about the one a server
# uses. No cycle: `sc-core-actions` reaches this adapter through
# `ctx.adapter("python")` and does not depend on this crate.
sc-core-actions.workspace = true
# The `fs` tests write to a real `LocalFileStore` and read the bytes back off
# the disk, for the reason the `db` tests use a real database.
sc-files.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# `features = ["eval"]` here and nowhere else in this crate: an **ownership
# formula** is JavaScript (§7.3), so a delegated read is decided on the V8
# isolate while the Python run waits — and phase 2.7's parity case runs the same
# question as a JavaScript body, which needs the engine that runs one.
sc-expr = { workspace = true, features = ["eval"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
