[package]
name = "sc-files"
description = "FileStore trait and local-directory driver with xattr metadata (layer 5)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sc-error.workspace = true
# `Attrs` for a store definition's backend settings, so a backend's settings use
# the same vocabulary every other configurable extension point does (§6.2).
sc-types.workspace = true
async-trait.workspace = true
bytes.workspace = true
# Extension → MIME mapping for a `File` field's MIME allow-list (§3.5).
mime_guess.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
# `process` drives the git backend: `git` and `ssh-keygen` are external
# processes, awaited without blocking a runtime thread (the same reason a code
# framework's build step needs it, §13.3).
tokio = { workspace = true, features = ["fs", "rt", "process"] }
# Cross-platform extended-attribute access (technical design §9/§14.1): POSIX
# xattrs (`user.` namespace) on Linux/macOS/FreeBSD/NetBSD/Android via the
# mature `xattr` crate, and NTFS Alternate Data Streams on Windows. This is the
# only maintained crate covering every platform the MVP targets; `xattr` alone
# has no Windows support.
fsquirrel = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt", "macros"] }

[lints]
workspace = true
